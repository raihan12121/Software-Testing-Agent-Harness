name: Scheduled Nightly SQA Run

on:
  schedule:
    # Run nightly at 02:00 UTC (sandboxed staging exploration)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (staging or local)'
        required: true
        default: 'staging'
      target_url:
        description: 'Target Base URL (defaults to sandboxed Demo Shop App if empty)'
        required: false
        default: ''

jobs:
  nightly-exploration:
    name: Nightly Autonomous Explore & SQA Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install uv and project dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -e ".[all,dev]"
          playwright install --with-deps chromium

      - name: Start Sandboxed Demo Shop Web Target
        run: |
          TARGET_URL="${{ github.event.inputs.target_url }}"
          if [ -z "$TARGET_URL" ] || [ "$TARGET_URL" = "https://staging.example.com" ]; then
            echo "Starting sandboxed Demo Shop application on http://127.0.0.1:8899..."
            python examples/demo_shop_app.py &
            sleep 2
            echo "TARGET_URL=http://127.0.0.1:8899" >> $GITHUB_ENV
          else
            echo "Using specified target URL: $TARGET_URL"
            echo "TARGET_URL=$TARGET_URL" >> $GITHUB_ENV
          fi

      - name: Run Sentinel Explore Mode against Staging
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sentinel run \
            --explore \
            --target-type web \
            --base-url "$TARGET_URL" \
            --env "${{ github.event.inputs.environment || 'staging' }}" \
            --format json \
            --output-dir reports \
            --allow-mutations

      - name: Upload SQA Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-nightly-reports
          path: |
            reports/
            artifacts/
          retention-days: 14
