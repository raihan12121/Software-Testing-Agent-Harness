[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-sqa"
version = "0.1.0"
description = "Universal SQA Testing Harness and Autonomous Agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Muhammad Raihan Molla", email = "raihan12121@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typing-extensions>=4.10.0",
    "httpx>=0.27.0",
    "jsonschema>=4.21.0",
    "jinja2>=3.1.3",
    "pillow>=10.2.0",
    "playwright>=1.43.0",
    "anthropic>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/raihan12121/Software-Testing-Agent-Harness"
Repository = "https://github.com/raihan12121/Software-Testing-Agent-Harness"
Documentation = "https://github.com/raihan12121/Software-Testing-Agent-Harness#readme"
"Bug Tracker" = "https://github.com/raihan12121/Software-Testing-Agent-Harness/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "build>=1.1.0",
    "twine>=5.0.0",
]
api = [
    "httpx>=0.27.0",
    "jsonschema>=4.21.0",
]
mobile = [
    "appium-python-client>=3.0.0",
]
desktop = [
    "pywinauto>=0.6.8; platform_system == 'Windows'",
]
iot = [
    "paho-mqtt>=1.6.1",
    "pyserial>=3.5",
]
db-extended = [
    "psycopg2-binary>=2.9.9",
    "pymongo>=4.6.0",
]
all = [
    "appium-python-client>=3.0.0",
    "paho-mqtt>=1.6.1",
    "pyserial>=3.5",
    "psycopg2-binary>=2.9.9",
    "pymongo>=4.6.0",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not live_eval'"
markers = [
    "live_eval: Live external API evaluation tests per design.md section 9",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
